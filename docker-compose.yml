version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: epms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: chandu5706
      MYSQL_DATABASE: smart_employee_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - epms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Service
  backend:
    build:
      context: ./employee-project-management-backend
      dockerfile: Dockerfile
    container_name: epms-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/smart_employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: chandu5706
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: notifications.epms@gmail.com
      APP_JWT_SECRET: SmartEmployeeProjectManagementSystemSecretKey2026SecureJWTKeyLength256BitOrHigherForJJWTRequirement!
      APP_JWT_EXPIRATION_MS: 86400000
    networks:
      - epms-network
    depends_on:
      mysql-db:
        condition: service_healthy

  # ReactJS Frontend Service
  frontend:
    build:
      context: ./employee-project-management-frontend
      dockerfile: Dockerfile
    container_name: epms-frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - epms-network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  epms-network:
    driver: bridge
